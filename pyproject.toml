[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ast-patch-applier"
version = "0.1.0"
description = "Deterministic AST-aware fuzzy diff applier applying AI-generated code edits without syntax corruption"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-ast-patch-applier = "agent_ast_patch_applier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ast_patch_applier*"]
